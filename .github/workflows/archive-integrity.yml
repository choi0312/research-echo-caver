name: archive-integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify sealed artifacts
        run: python3 scripts/verify_archive.py
      - name: Run archive tests
        run: python3 -m unittest discover -s tests -v

