<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">Full MMAD task deltas of ECHO-CAVER versus archived FREB-CAVER</title>
  <desc id="desc">Positive gains for anomaly detection, defect classification, defect description and defect localization; small regressions for defect analysis, object analysis and object classification.</desc>
  <rect width="1240" height="620" rx="24" fill="#f8fafc"/>
  <text x="70" y="64" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Full-MMAD task delta vs. archived FREB</text>
  <text x="70" y="94" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">Percentage points; descriptive, not a paired significance estimate</text>
  <line x1="394" y1="130" x2="394" y2="555" stroke="#475569" stroke-width="2"/>
  <line x1="70" y1="555" x2="1170" y2="555" stroke="#cbd5e1"/>
  <g font-family="Inter,Arial,sans-serif" font-size="17" fill="#334155">
    <text x="370" y="166" text-anchor="end">Anomaly Detection</text>
    <text x="370" y="224" text-anchor="end">Defect Analysis</text>
    <text x="370" y="282" text-anchor="end">Defect Classification</text>
    <text x="370" y="340" text-anchor="end">Defect Description</text>
    <text x="370" y="398" text-anchor="end">Defect Localization</text>
    <text x="370" y="456" text-anchor="end">Object Analysis</text>
    <text x="370" y="514" text-anchor="end">Object Classification</text>
  </g>
  <!-- scale: 400 px per percentage point -->
  <rect x="394" y="143" width="170.2" height="30" rx="6" fill="#0891b2"/>
  <text x="576" y="165" fill="#0e7490" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">+0.426</text>
  <rect x="351.1" y="201" width="42.9" height="30" rx="6" fill="#f97316"/>
  <text x="340" y="223" text-anchor="end" fill="#c2410c" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">-0.107</text>
  <rect x="394" y="259" width="613.3" height="30" rx="6" fill="#0891b2"/>
  <text x="1018" y="281" fill="#0e7490" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">+1.533</text>
  <rect x="394" y="317" width="428.5" height="30" rx="6" fill="#0891b2"/>
  <text x="833" y="339" fill="#0e7490" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">+1.071</text>
  <rect x="394" y="375" width="493.9" height="30" rx="6" fill="#0891b2"/>
  <text x="899" y="397" fill="#0e7490" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">+1.235</text>
  <rect x="331.2" y="433" width="62.8" height="30" rx="6" fill="#f97316"/>
  <text x="320" y="455" text-anchor="end" fill="#c2410c" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">-0.157</text>
  <rect x="244.2" y="491" width="149.8" height="30" rx="6" fill="#f97316"/>
  <text x="233" y="513" text-anchor="end" fill="#c2410c" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">-0.375</text>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">
    <text x="194" y="580" text-anchor="middle">-0.5</text>
    <text x="394" y="580" text-anchor="middle">0</text>
    <text x="594" y="580" text-anchor="middle">+0.5</text>
    <text x="794" y="580" text-anchor="middle">+1.0</text>
    <text x="994" y="580" text-anchor="middle">+1.5</text>
