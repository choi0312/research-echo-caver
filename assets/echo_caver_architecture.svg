<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
  <title id="title">ECHO-CAVER architecture</title>
  <desc id="desc">A frozen JUDO vision and language backbone, frozen FREB evidence writers, and constrained ECHO residual readers in immediately downstream layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081221"/>
      <stop offset="1" stop-color="#122744"/>
    </linearGradient>
    <linearGradient id="echo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="1440" height="690" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">ECHO-CAVER</text>
  <text x="70" y="106" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">Evidence-tangent readers aligned to frozen FREB writer geometry</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="250" height="150" rx="18" fill="#152b47" stroke="#3b82f6" stroke-width="2"/>
    <text x="195" y="211" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Input pair</text>
    <rect x="98" y="236" width="88" height="56" rx="10" fill="#1e3a5f" stroke="#60a5fa"/>
    <rect x="204" y="236" width="88" height="56" rx="10" fill="#1e3a5f" stroke="#60a5fa"/>
    <text x="142" y="270" text-anchor="middle" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="15">Query</text>
    <text x="248" y="261" text-anchor="middle" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="14">Normal</text>
    <text x="248" y="278" text-anchor="middle" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="14">reference</text>

    <rect x="385" y="170" width="235" height="150" rx="18" fill="#152b47" stroke="#3b82f6" stroke-width="2"/>
    <text x="502" y="218" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Frozen JUDO</text>
    <text x="502" y="251" text-anchor="middle" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="16">vision encoder</text>
    <text x="502" y="278" text-anchor="middle" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="16">+ decoder backbone</text>
    <rect x="441" y="292" width="122" height="5" rx="2.5" fill="#3b82f6"/>

    <rect x="690" y="145" width="300" height="200" rx="18" fill="#172238" stroke="#f59e0b" stroke-width="2"/>
    <text x="840" y="187" text-anchor="middle" fill="#fef3c7" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Frozen FREB writers</text>
    <text x="840" y="219" text-anchor="middle" fill="#fcd34d" font-family="Inter,Arial,sans-serif" font-size="16">layers 18 / 20 / 22 / 24 / 26</text>
    <rect x="730" y="244" width="220" height="52" rx="10" fill="#422f18" stroke="#f59e0b"/>
    <text x="840" y="267" text-anchor="middle" fill="#fde68a" font-family="Inter,Arial,sans-serif" font-size="14">comparison evidence</text>
    <text x="840" y="286" text-anchor="middle" fill="#fde68a" font-family="Inter,Arial,sans-serif" font-size="14">W = U Sigma V^T</text>
    <text x="840" y="322" text-anchor="middle" fill="#d6b66b" font-family="Inter,Arial,sans-serif" font-size="13">writer weights remain fixed</text>

    <rect x="1060" y="135" width="310" height="220" rx="18" fill="#17283c" stroke="#22d3ee" stroke-width="3"/>
    <text x="1215" y="179" text-anchor="middle" fill="#ecfeff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">ECHO residual readers</text>
    <text x="1215" y="211" text-anchor="middle" fill="#a5f3fc" font-family="Inter,Arial,sans-serif" font-size="16">layers 19 / 21 / 23 / 25 / 27</text>
    <text x="1215" y="239" text-anchor="middle" fill="#a5f3fc" font-family="Inter,Arial,sans-serif" font-size="15">rank-16 LoRA on o_proj + down_proj</text>
    <rect x="1101" y="263" width="228" height="54" rx="10" fill="url(#echo)" opacity="0.9"/>
    <text x="1215" y="286" text-anchor="middle" fill="#07111f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">B &lt;- U32 U32^T B</text>
    <text x="1215" y="307" text-anchor="middle" fill="#07111f" font-family="Inter,Arial,sans-serif" font-size="13">gradient + post-Adam projection</text>
    <text x="1215" y="338" text-anchor="middle" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="13">2.38M trainable parameters</text>
  </g>

  <line x1="320" y1="245" x2="382" y2="245" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="245" x2="687" y2="245" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="990" y1="245" x2="1057" y2="245" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="420" width="1300" height="185" rx="18" fill="#0e1d31" stroke="#334155"/>
  <text x="105" y="463" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Training constraints</text>
  <g font-family="Inter,Arial,sans-serif" font-size="16">
    <circle cx="114" cy="505" r="6" fill="#22d3ee"/><text x="133" y="511" fill="#cbd5e1">Answer CE and wrong-answer repair margin</text>
    <circle cx="114" cy="545" r="6" fill="#22d3ee"/><text x="133" y="551" fill="#cbd5e1">Semantic option-permutation equivariance</text>
    <circle cx="635" cy="505" r="6" fill="#818cf8"/><text x="654" y="511" fill="#cbd5e1">Frozen-FREB KL retention</text>
    <circle cx="635" cy="545" r="6" fill="#818cf8"/><text x="654" y="551" fill="#cbd5e1">Zero-init exact identity</text>
    <circle cx="995" cy="505" r="6" fill="#f59e0b"/><text x="1014" y="511" fill="#cbd5e1">No inference router</text>
    <circle cx="995" cy="545" r="6" fill="#f59e0b"/><text x="1014" y="551" fill="#cbd5e1">One end-to-end runtime</text>
  </g>
  <text x="720" y="654" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Frozen components are blue/amber; trainable evidence-tangent readers are cyan.</text>
</svg>

